plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.gamepulse'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.gamepulse'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

// Mantiene compatibilidad con lambdas y sintaxis de Java 8.
android.compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
}
